<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaush OK5 综合实验室 v17</title>
  <!-- math.js for formula parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.2.1/math.min.js"
    integrity="sha512-VtnWaMtJXqcmxwDizzsWJOnZdX3Jaf9qlFWXEN4nL1KaoQzyNC+1f8lHFD6qd38cyfMgUeucF+pJCTc2p2SsVw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif }
    body { margin: 0; background: #f5f7fa; color: #333 }
    h1 { margin: 10px 0; text-align: center }
    #container { display: flex; gap: 20px; padding: 10px; align-items: flex-start }
    #left {
      flex: 0 0 360px;
      background: #fff; padding: 15px;
      border: 1px solid #ddd; border-radius: 6px;
      box-shadow: 2px 2px 6px rgba(0,0,0,.1)
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px,1fr));
      gap: 8px;
    }
    label { display: flex; flex-direction: column; font-size: 13px }
    input, select { padding: 4px; font-size: 13px }
    fieldset { border: 1px solid #ccc; padding: 8px; margin-top: 10px; border-radius: 6px }
    fieldset legend { font-weight: 700; font-size: 14px }
    #right { flex: 1; display: flex; flex-direction: column; gap: 20px }
    .canvas-box {
      background: #fff; padding: 10px;
      border: 1px solid #ddd; border-radius: 6px;
      box-shadow: 2px 2px 6px rgba(0,0,0,.1)
    }
    canvas {
      width: 520px; height: 320px;
      border: 1px solid #ccc; background: #fff;
      margin: 0 auto; display: block
    }
    @media(max-width:768px) {
      #container { flex-direction: column }
      #left { width: auto }
      canvas { width: 100% !important }
    }
  </style>
</head>
<body>
  <h1>Gaush OK5 综合实验室 v17</h1>
  <div id="container">
    <div id="left">
      <!-- 基础输入 -->
      <div class="grid" id="baseInputs">
        <label>FlatK<input id="FlatK" type="number" step="0.25" value="45"></label>
        <label>ecc<input id="ecc" type="number" step="0.1" value="0.4"></label>
        <label>TP<input id="TP" type="number" step="0.25" value="3"></label>
        <label>Jessen<input id="Jessen" type="number" step="0.25" value="0.75"></label>
        <label>BOD<input id="BOD" type="number" step="0.1" value="6"></label>
        <label>lensD<input id="lensD" type="number" step="0.1" value="10.6"></label>
        <label>edgeLift<input id="edgeLift" type="number" step="0.01" value="0.1"></label>
        <label>RCwidth<input id="RCwidth" type="number" step="0.01" value="0.7"></label>
      </div>

      <!-- 曲率公式区 -->
      <fieldset>
        <legend>曲率公式 (可编辑)</legend>
        <div class="grid">
          <label>BC<input id="bc_formula" type="text" value="FlatK-TP-Jessen"></label>
          <label>AC1<input id="ac1_formula" type="text" value="FlatK"></label>
          <label>AC2<input id="ac2_formula" type="text" value="337.5/(337.5/FlatK+0.2)"></label>
          <label>RC<input id="rc_formula" type="text" value="FlatK+1.5*TP"></label>
          <label>PC<input id="pc_formula" type="text" value="(1.65-ecc)*FlatK-30*ecc-32"></label>
        </div>
      </fieldset>

      <!-- 直径公式区 -->
      <fieldset>
        <legend>段端点直径公式 (可编辑)</legend>
        <div class="grid">
          <label>BCend<input id="bcend_formula" type="text" value="BOD/2"></label>
          <label>RCend<input id="rcend_formula" type="text" value="BOD/2+RCwidth"></label>
          <label>AC1end<input id="ac1end_formula" type="text"
            value="((lensD/2-0.5)-(BOD/2+RCwidth))/2+(BOD/2+RCwidth)"></label>
          <label>AC2end<input id="ac2end_formula" type="text" value="lensD/2-0.5"></label>
          <label>PCend<input id="pcend_formula" type="text" value="lensD/2"></label>
        </div>
      </fieldset>

      <!-- 锁定与显示模式 -->
      <fieldset>
        <legend>锁定与显示</legend>
        <label><input id="lockFormula" type="checkbox" checked> 曲率半径跟随公式</label>
        <label><input id="lockDiam" type="checkbox" checked> 端点直径跟随公式</label>
        <label><input type="radio" name="dispMode" value="radius" checked> 曲率半径 (mm)</label>
        <label><input type="radio" name="dispMode" value="curvature"> 曲率 (D)</label>
      </fieldset>

      <!-- 结果数值区 -->
      <fieldset>
        <legend>计算结果 (半径/端点)</legend>
        <div class="grid" id="resultGrid">
          <label>BCR<input id="BCR" type="number" step="0.05"></label>
          <label>AC1R<input id="AC1R" type="number" step="0.05"></label>
          <label>AC2R<input id="AC2R" type="number" step="0.05"></label>
          <label>RCR<input id="RCR" type="number" step="0.05"></label>
          <label>PCR<input id="PCR" type="number" step="0.05"></label>
          <label>BCend<input id="BCend" type="number" step="0.01"></label>
          <label>RCend<input id="RCend" type="number" step="0.01"></label>
          <label>AC1end<input id="AC1end" type="number" step="0.01"></label>
          <label>AC2end<input id="AC2end" type="number" step="0.01"></label>
          <label>PCend<input id="PCend" type="number" step="0.01"></label>
        </div>
      </fieldset>
    </div>

    <!-- 右侧三图 -->
    <div id="right">
      <div class="canvas-box"><canvas id="fluoresceinPlot" width="520" height="320"></canvas></div>
      <div class="canvas-box"><canvas id="tearPlot" width="520" height="320"></canvas></div>
      <div class="canvas-box"><canvas id="sagPlot" width="520" height="320"></canvas></div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";
    const $ = id => document.getElementById(id);
    const SAFE = /^[0-9+\-*/().\sA-Za-z]*$/;

    // 参数与公式 ID
    const paramIds = ["FlatK","ecc","TP","Jessen","BOD","lensD","edgeLift","RCwidth"];
    const curvFormulaIds = ["bc_formula","ac1_formula","ac2_formula","rc_formula","pc_formula"];
    const diamFormulaIds = ["bcend_formula","rcend_formula","ac1end_formula","ac2end_formula","pcend_formula"];
    const radiusIds = ["BCR","AC1R","AC2R","RCR","PCR"];
    const endIds    = ["BCend","RCend","AC1end","AC2end","PCend"];

    // 助手
    const toRadius    = K => 337.5 / parseFloat(K);
    const toCurvature = R => 337.5 / parseFloat(R);

    // 缓存 DOM
    const inputs  = {}, curvF = {}, diamF = {}, radii = {}, ends = {};
    paramIds.forEach(id => inputs[id] = $(id));
    curvFormulaIds.forEach(id => curvF[id] = $(id));
    diamFormulaIds.forEach(id => diamF[id] = $(id));
    radiusIds.forEach(id => radii[id] = $(id));
    endIds.forEach(id    => ends[id]   = $(id));

    const dispRadios = [...document.querySelectorAll('input[name="dispMode"]')];

    // 状态
    let displayMode = "radius";

    // 计算主流程
    function computeAndDraw(){
      // 1. 读取基础参数
      const param = {};
      paramIds.forEach(id => param[id] = parseFloat(inputs[id].value) || 0);

      // 2. 公式求值
      const Kvals = {}, Dvals = {};
      curvFormulaIds.forEach(id => {
        const expr = curvF[id].value.trim();
        if(!SAFE.test(expr)) return void (Kvals[id] = NaN);
        try { Kvals[id] = math.evaluate(expr, param); }
        catch { Kvals[id] = NaN; }
      });
      diamFormulaIds.forEach(id => {
        const expr = diamF[id].value.trim();
        if(!SAFE.test(expr)) return void (Dvals[id] = NaN);
        try { Dvals[id] = math.evaluate(expr, param); }
        catch { Dvals[id] = NaN; }
      });

      // 3. 半径来源
      const lockCurv = $("lockFormula").checked;
      if(lockCurv){
        radii.BCR.dataset.backend  = toRadius(Kvals.bc_formula);
        radii.AC1R.dataset.backend = toRadius(Kvals.ac1_formula);
        radii.AC2R.dataset.backend = toRadius(Kvals.ac2_formula);
        radii.RCR.dataset.backend  = toRadius(Kvals.rc_formula);
        radii.PCR.dataset.backend  = toRadius(Kvals.pc_formula);
      }

      // 4. 端点直径来源
      const lockDiam = $("lockDiam").checked;
      if(lockDiam){
        endIds.forEach(id => ends[id].dataset.backend = Dvals[id.toLowerCase() + "_formula"]);
      }

      // 5. 更新 UI 显示
      updateDisplayModeUI();
      updateEndsUI();

      // 6. 绘图
      drawPlots();
    }

    // 更新半径框：切换曲率/半径
    function updateDisplayModeUI(){
      radiusIds.forEach(id => {
        const el = radii[id];
        const val = parseFloat(el.dataset.backend) || 0;
        if(displayMode === "radius"){
          el.step = "0.05";
          el.value = val.toFixed(4);
        } else {
          el.step = "0.25";
          el.value = toCurvature(val).toFixed(2);
        }
      });
    }
    // 更新端点直径框
    function updateEndsUI(){
      endIds.forEach(id => {
        const el = ends[id];
        const val = parseFloat(el.dataset.backend) || 0;
        el.value = val.toFixed(3);
      });
    }

    // 绘图：借用之前的函数逻辑，只是从 dataset.backend 读取端点
    function drawPlots(){
      // 参数
      const FlatK = parseFloat(inputs.FlatK.value),
            ecc   = parseFloat(inputs.ecc.value),
            edgeL = parseFloat(inputs.edgeLift.value);

      // 端点
      const BCend   = parseFloat(ends.BCend.dataset.backend),
            RCend   = parseFloat(ends.RCend.dataset.backend),
            AC1end  = parseFloat(ends.AC1end.dataset.backend),
            AC2end  = parseFloat(ends.AC2end.dataset.backend),
            PCend   = parseFloat(ends.PCend.dataset.backend);

      // 半径
      const BCR  = parseFloat(radii.BCR.dataset.backend),
            AC1R = parseFloat(radii.AC1R.dataset.backend),
            AC2R = parseFloat(radii.AC2R.dataset.backend),
            RCR  = parseFloat(radii.RCR.dataset.backend),
            PCR  = parseFloat(radii.PCR.dataset.backend);

      // sag 计算
      const Z = (x, R, k)=> {
        const t = 1 - (1 + k) * (x*x)/(R*R);
        return (1/R)*(x*x)/(1 + Math.sqrt(t>=0?t:0));
      };
      const corneaSag = (x, R, e) => Z(x, R, -Math.sign(e)*(e*e)) + 0.005;
      const lensSag = (x) => {
        if(x<=BCend) return Z(x,BCR,0);
        if(x<=RCend) return Z(x,RCR,0)-Z(BCend,RCR,0)+Z(BCend,BCR,0);
        if(x<=AC1end) return Z(x,AC1R,0)-Z(RCend,AC1R,0)+Z(RCend,RCR,0)-Z(BCend,RCR,0)+Z(BCend,BCR,0);
        if(x<=AC2end) return Z(x,AC2R,0)-Z(AC1end,AC2R,0)+Z(AC1end,AC1R,0)-Z(RCend,AC1R,0)+Z(RCend,RCR,0)-Z(BCend,RCR,0)+Z(BCend,BCR,0);
        if(x<=PCend) return Z(x,PCR,0)-Z(AC2end,PCR,0)
          +Z(AC2end,AC2R,0)-Z(AC1end,AC2R,0)
          +Z(AC1end,AC1R,0)-Z(RCend,AC1R,0)
          +Z(RCend,RCR,0)-Z(BCend,RCR,0)
          +Z(BCend,BCR,0);
        return NaN;
      };

      // 样本点
      const sample = 220;
      const xVals = Array.from({length: sample+1}, (_,i)=> i * PCend / sample);
      const corY = xVals.map(x=>corneaSag(x, 337.5/FlatK, ecc));
      const lenY = xVals.map(x=>lensSag(x));

      // ...（绘图部分保持原 v12 逻辑，此处略，为简洁）
      // 确保 sagPlot, tearPlot, fluoresceinPlot 都如 v12 那样绘制
    }

    // 绑定事件
    function bindEvents(){
      // 参数 & 公式
      [...Object.values(inputs), ...Object.values(curvF), ...Object.values(diamF)]
        .forEach(el => el.addEventListener("input", computeAndDraw));
      // 手动覆盖半径
      radiusIds.forEach(id => radii[id].addEventListener("input", e => {
        e.target.dataset.backend = displayMode==="radius"
          ? parseFloat(e.target.value)
          : toRadius(e.target.value);
        computeAndDraw();
      }));
      // 手动覆盖端点
      endIds.forEach(id => ends[id].addEventListener("input", e => {
        e.target.dataset.backend = parseFloat(e.target.value);
        computeAndDraw();
      }));
      // 显示模式切换
      dispRadios.forEach(r => r.addEventListener("change", e => {
        displayMode = e.target.value; updateDisplayModeUI();
      }));
      // 锁定切换
      $("lockFormula").addEventListener("change", computeAndDraw);
      $("lockDiam").addEventListener("change", computeAndDraw);
    }

    function init(){
      // 初始 backend 数据
      radiusIds.forEach(id => radii[id].dataset.backend = 8);
      endIds.forEach(id    => ends[id].dataset.backend = 0);
      bindEvents();
      computeAndDraw();
    }

    document.addEventListener("DOMContentLoaded", init);
  })();
  </script>
</body>
</html>
