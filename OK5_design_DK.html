<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Gaush OK5 实验室</title>
  <style>
    /* 全局样式 */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
    }
    h1, h2 {
      margin: 10px 0;
      text-align: center;
    }
    /* 主容器：左右两栏布局（桌面端），移动端上下堆叠 */
    #container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      padding: 10px;
      gap: 20px;
    }
    /* 左侧：参数输入和结果显示 */
    #left-panel {
      flex: 0 0 340px;
      background: #ffffff;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }
    /* 主输入参数网格 */
    #inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    #inputs label {
      display: flex;
      flex-direction: column;
      font-size: 13px;
      margin-bottom: 4px;
    }
    #inputs input, #inputs select {
      padding: 4px;
      font-size: 13px;
    }
    /* 新增：显示模式切换区域 */
    fieldset#displayModeFieldset {
      border: 1px solid #ccc;
      padding: 8px;
      margin-top: 8px;
      border-radius: 4px;
    }
    fieldset#displayModeFieldset legend {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }
    fieldset#displayModeFieldset label {
      font-size: 13px;
      margin-right: 10px;
    }
    /* “曲率半径 (可修改)”区域 */
    fieldset {
      border: 1px solid #ccc;
      padding: 8px;
      margin-top: 8px;
      border-radius: 4px;
    }
    fieldset legend {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .radius-params {
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px 12px;
      margin-top: 4px;
    }
    .radius-params label {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 13px;
    }
    .radius-params label span { margin-right: 4px; }
    .radius-params input {
      width: 80px;
      padding: 3px;
      font-size: 13px;
    }
    #results {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.4;
    }
    /* 右侧：绘图区域 */
    #right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .canvas-container {
      background: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }
    /* 画布尺寸调整 */
    canvas {
      width: 500px;
      height: 320px;
      display: block;
      border: 1px solid #ccc;
      background: #fff;
      margin: 0 auto;
    }
    /* 响应式设计：移动端下改为上下排列 */
    @media (max-width: 768px) {
      #container { flex-direction: column; }
      #left-panel { width: auto; }
      canvas { width: 100% !important; }
    }
  </style>
</head>
<body>
  <h1>Gaush OK5 实验室</h1>
  <div id="container">
    <!-- 左侧区域：参数输入和结果显示 -->
    <div id="left-panel">
      <!-- 基础输入参数区 -->
      <div id="inputs">
        <label>FlatK:
          <input id="FlatK" type="number" value="45" step="0.25">
        </label>
        <label>ecc:
          <input id="ecc" type="number" value="0.4" step="0.1">
        </label>
        <label>TP:
          <input id="TP" type="number" value="3" step="0.25">
        </label>
        <label>Jessen:
          <input id="Jessen" type="number" value="0.75" step="0.25">
        </label>
        <label>BOD:
          <input id="BOD" type="number" value="6" step="0.1">
        </label>
        <label>lensD:
          <input id="lensD" type="number" value="10.6" step="0.1">
        </label>
        <label>edgeLift (mm):
          <input id="edgeLift" type="number" value="0.1" step="0.01">
        </label>
      </div>
      <!-- 新增显示模式切换 -->
      <fieldset id="displayModeFieldset">
        <legend>显示模式</legend>
        <label>
          <input type="radio" name="displayMode" value="radius" checked>
          曲率半径
        </label>
        <label>
          <input type="radio" name="displayMode" value="curvature">
          曲率
        </label>
      </fieldset>
      <!-- 其它可修改曲率参数（不含 RCR） -->
      <fieldset>
        <legend>曲率半径 (可修改)</legend>
        <div class="radius-params">
          <label><span>corneaR:</span>
            <input id="corneaR" type="number" step="0.05">
          </label>
          <label><span>BCR:</span>
            <input id="BCR" type="number" step="0.05">
          </label>
          <label><span>AC1R:</span>
            <input id="AC1R" type="number" step="0.05">
          </label>
          <label><span>AC2R:</span>
            <input id="AC2R" type="number" step="0.05">
          </label>
          <label><span>PCR:</span>
            <input id="PCR" type="number" step="0.05">
          </label>
        </div>
      </fieldset>
      <!-- 锁定复选框，单独一行 -->
      <div style="margin-top:8px;">
        <label style="font-size:13px;">
          <input type="checkbox" id="lockAC2R"> 锁定AC2R与AC1R差值
        </label>
      </div>
      <!-- RCR 独立区域 -->
      <fieldset>
        <legend>RCR 计算 (重要)</legend>
        <label style="display:block; margin-bottom:6px;">
          等高点位置:
          <select id="equalHeightPoint" style="width:120px;">
            <option value="RCend">RCend</option>
            <option value="AC1end">AC1end</option>
            <option value="AC2end" selected>AC2end (默认)</option>
          </select>
        </label>
        <div style="margin-bottom:6px;">
          <span style="font-weight:bold;">RCR 计算方法:</span><br>
          <label style="display:block; margin-left:16px;">
            <input type="radio" name="rcrOption" id="rcrOptionNumerical" value="numerical" checked>
            数值求解 (<span id="RCR_numerical_display"></span>)
          </label>
          <label style="display:block; margin-left:16px;">
            <input type="radio" name="rcrOption" id="rcrOptionSimple" value="simple">
            简单计算 (<span id="RCR_simple_display"></span>)
          </label>
        </div>
        <label style="display:block;">
          RCR (最终使用):
          <input id="RCR" type="number" step="0.05" style="width:120px;">
        </label>
      </fieldset>
      <!-- 操作按钮，仅保留“计算曲率参数” -->
      <div style="margin-top:10px;">
        <button id="calculateBtn" style="padding:6px 12px;">计算曲率参数</button>
      </div>
      <!-- 结果显示区域，此处将显示各弧段宽度 -->
      <div id="results"></div>
    </div>
    
    <!-- 右侧区域：绘图 -->
    <div id="right-panel">
      <!-- 从上至下：泪液荧光素图、泪膜厚度图、角膜与晶状体矢高图 -->
      <div class="canvas-container">
        <canvas id="fluoresceinPlot" width="500" height="320"></canvas>
      </div>
      <div class="canvas-container">
        <canvas id="tearPlot" width="500" height="320"></canvas>
      </div>
      <div class="canvas-container">
        <canvas id="combinedPlot" width="500" height="320"></canvas>
      </div>
    </div>
  </div>
  
  <script>
    // 固定常量
    const CORNEA_AT0 = 0.005;
    const SAG_BC_AT0 = 0;
    // 全局显示模式，默认使用曲率半径
    let displayMode = "radius"; // 或 "curvature"
    // 需要双重显示转换的字段 ID
    const curvatureFieldIds = ["corneaR", "BCR", "AC1R", "AC2R", "PCR", "RCR"];
    
    /***************************************************************************************
     * 辅助转换函数：前台显示 <--> 后台数据（始终以曲率半径为后台单位）
     ***************************************************************************************/
    // 当处于曲率模式时，显示值 = 337.5 / 后台值；否则直接显示后台值
    const convertBackendToDisplay = backendValue =>
      displayMode === "curvature" ? (337.5 / backendValue) : backendValue;
    // 用户输入的显示值转换成后台的曲率半径数值
    const convertDisplayToBackend = displayValue =>
      displayMode === "curvature" ? (337.5 / displayValue) : displayValue;
    
    // 更新所有相关字段的显示（根据 data-backend 值）
    const updateDisplayMode = () => {
      curvatureFieldIds.forEach(id => {
        const field = document.getElementById(id);
        const backendValue = parseFloat(field.dataset.backend);
        if (!isNaN(backendValue) && backendValue > 0) {
          field.value = convertBackendToDisplay(backendValue).toFixed(4);
        }
        // 当处于曲率显示模式时，步长设为 0.25，否则恢复 0.05
        field.step = displayMode === "curvature" ? "0.25" : "0.05";
      });
    };
    
    // 为每个需要双重显示的输入字段绑定事件：更新 data-backend 和显示值
    curvatureFieldIds.forEach(id => {
      const field = document.getElementById(id);
      field.addEventListener("input", (e) => {
        const inputVal = parseFloat(e.target.value);
        if (!isNaN(inputVal) && inputVal > 0) {
          e.target.dataset.backend = convertDisplayToBackend(inputVal);
        }
      });
      field.addEventListener("blur", () => {
        updateDisplayMode();
        drawPlots();
      });
    });
    
    // 为显示模式单选按钮绑定事件，切换模式后更新显示和重绘图形
    document.querySelectorAll('input[name="displayMode"]').forEach(radio => {
      radio.addEventListener("change", (e) => {
        displayMode = e.target.value;
        updateDisplayMode();
        drawPlots();
      });
    });
    
    /***************************************************************************************
     * 数学函数模块
     ***************************************************************************************/
    const Z = (x, R, k) => {
      const term = 1 - (1 + k) * (x * x) / (R * R);
      const sqrtTerm = Math.sqrt(term >= 0 ? term : 0);
      return (1 / R) * (x * x) / (1 + sqrtTerm);
    };
    const corneaSag = (x, corneaR, ecc, corneaAt0) =>
      Z(x, corneaR, -Math.sign(ecc) * (ecc * ecc)) + corneaAt0;
    const lensSag = (x, p, RCR, PCR) => {
      const { BCR, AC1R, AC2R, BCend, RCend, AC1end, AC2end, PCend, SagBCAt0 } = p;
      const SagAtBCend  = Z(BCend, BCR, 0) + SagBCAt0;
      const SagAtRCend  = Z(RCend, RCR, 0) - Z(BCend, RCR, 0) + SagAtBCend;
      const SagAtAC1end = Z(AC1end, AC1R, 0) - Z(RCend, AC1R, 0) + SagAtRCend;
      const SagAtAC2end = Z(AC2end, AC2R, 0) - Z(AC1end, AC2R, 0) + SagAtAC1end;
      if (x >= 0 && x <= BCend) {
        return Z(x, BCR, 0) + SagBCAt0;
      } else if (x > BCend && x <= RCend) {
        return Z(x, RCR, 0) - Z(BCend, RCR, 0) + SagAtBCend;
      } else if (x > RCend && x <= AC1end) {
        return Z(x, AC1R, 0) - Z(RCend, AC1R, 0) + SagAtRCend;
      } else if (x > AC1end && x <= AC2end) {
        return Z(x, AC2R, 0) - Z(AC1end, AC2R, 0) + SagAtAC1end;
      } else if (x > AC2end && x <= PCend) {
        return Z(x, PCR, 0) - Z(AC2end, PCR, 0) + SagAtAC2end;
      } else {
        return NaN;
      }
    };
    const tearSag = (x, p, RCR, PCR, corneaR, ecc, corneaAt0) =>
      corneaSag(x, corneaR, ecc, corneaAt0) - lensSag(x, p, RCR, PCR);
    
    /***************************************************************************************
     * 二分法求根
     ***************************************************************************************/
    const findRootBisection = (f, low, high, tol = 1e-6, maxIter = 100) => {
      let fLow = f(low);
      let fHigh = f(high);
      if (fLow * fHigh > 0) {
        throw new Error("二分法求根失败：低值与高值函数符号相同。");
      }
      let mid;
      for (let i = 0; i < maxIter; i++) {
        mid = (low + high) / 2;
        const fMid = f(mid);
        if (Math.abs(fMid) < tol) return mid;
        if (fLow * fMid < 0) {
          high = mid;
          fHigh = fMid;
        } else {
          low = mid;
          fLow = fMid;
        }
      }
      return mid;
    };
    
    /***************************************************************************************
     * 辅助函数：绘制坐标轴刻度
     ***************************************************************************************/
    const drawAxisTicks = (ctx, transformX, transformY, xMin, xMax, yMin, yMax, xTicks = 5, yTicks = 5, decimals = 1) => {
      ctx.save();
      ctx.strokeStyle = "#555";
      ctx.fillStyle = "#333";
      ctx.font = "12px sans-serif";
      // X轴刻度
      ctx.textAlign = "center";
      for (let i = 0; i <= xTicks; i++) {
        const xVal = xMin + i * (xMax - xMin) / xTicks;
        const px = transformX(xVal);
        const py = transformY(yMin);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px, py + 5);
        ctx.stroke();
        ctx.fillText(xVal.toFixed(decimals), px, py + 18);
      }
      // Y轴刻度
      ctx.textAlign = "right";
      for (let j = 0; j <= yTicks; j++) {
        const yVal = yMin + j * (yMax - yMin) / yTicks;
        const py = transformY(yVal);
        const px = transformX(xMin);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px - 5, py);
        ctx.stroke();
        ctx.fillText(yVal.toFixed(decimals), px - 8, py + 4);
      }
      ctx.restore();
    };
    
    /***************************************************************************************
     * 全局变量：存放 RCR 数值求解与简单计算结果及 AC2R 锁定差值
     ***************************************************************************************/
    let globalRCR_numerical = null;
    let globalRCR_simple = null;
    let ac2rDelta = null;
    
    const updateRCRField = () => {
      const isNumerical = document.getElementById("rcrOptionNumerical").checked;
      const RCRField = document.getElementById("RCR");
      if (isNumerical && globalRCR_numerical !== null) {
        RCRField.dataset.backend = globalRCR_numerical;
      } else if (!isNumerical && globalRCR_simple !== null) {
        RCRField.dataset.backend = globalRCR_simple;
      }
      updateDisplayMode();
    };
    
    /***************************************************************************************
     * 辅助函数：计算各弧段宽度
     *  BC宽度 = BCend  
     *  RC宽度 = RCend - BCend  
     *  AC1宽度 = AC1end - RCend  
     *  AC2宽度 = AC2end - AC1end  
     *  PC宽度 = PCend - AC2end
     ***************************************************************************************/
    const computeSegmentWidths = ({ BCend, RCend, AC1end, AC2end, PCend }) => ({
      BC_width: BCend,
      RC_width: RCend - BCend,
      AC1_width: AC1end - RCend,
      AC2_width: AC2end - AC1end,
      PC_width: PCend - AC2end
    });
    
    /***************************************************************************************
     * 计算曲率参数（点击“计算曲率参数”按钮时调用）
     ***************************************************************************************/
    const calculateParameters = () => {
      const FlatK = parseFloat(document.getElementById("FlatK").value);
      const ecc = parseFloat(document.getElementById("ecc").value);
      const TP = parseFloat(document.getElementById("TP").value);
      const Jessen = parseFloat(document.getElementById("Jessen").value);
      const BOD = parseFloat(document.getElementById("BOD").value);
      const lensD = parseFloat(document.getElementById("lensD").value);
      const edgeLift = parseFloat(document.getElementById("edgeLift").value);
    
      // 计算各区域曲率半径（后台单位均为曲率半径）
      const computedCorneaR = 337.5 / FlatK;
      const computedBCR = 337.5 / (FlatK - TP - Jessen);
      const computedAC1R = 337.5 / FlatK;
      const computedAC2R = computedAC1R + 0.2;
    
      // 计算止点位置（作为后续其他计算的基础）
      const BCend  = BOD / 2;
      const RCend  = BOD / 2 + 0.7;
      const AC1end = ((lensD / 2 - 0.5) - (BOD / 2 + 0.7)) / 2 + (BOD / 2 + 0.7);
      const AC2end = lensD / 2 - 0.5;
      const PCend  = lensD / 2;
    
      // 计算各弧段宽度
      const { BC_width, RC_width, AC1_width, AC2_width, PC_width } = 
            computeSegmentWidths({ BCend, RCend, AC1end, AC2end, PCend });
    
      const params = {
        BCR: computedBCR,
        AC1R: computedAC1R,
        AC2R: computedAC2R,
        BCend, RCend, AC1end, AC2end, PCend,
        SagBCAt0: SAG_BC_AT0
      };
    
      const equalChoice = document.getElementById("equalHeightPoint").value;
      let xEqual;
      if (equalChoice === "RCend") {
        xEqual = RCend;
      } else if (equalChoice === "AC1end") {
        xEqual = AC1end;
      } else {
        xEqual = AC2end;
      }
    
      let RCR_numerical;
      try {
        const F = RCR => lensSag(xEqual, params, RCR, 0) - corneaSag(xEqual, computedCorneaR, ecc, CORNEA_AT0);
        RCR_numerical = findRootBisection(F, 2, 20);
      } catch (e) {
        alert("无法求解 RCR(数值): " + e.message);
        return;
      }
      const RCR_simple = 337.5 / (FlatK + TP * 2);
    
      let PCR_value;
      try {
        const G = PCR => lensSag(PCend, params, RCR_numerical, PCR) -
                           (corneaSag(PCend, computedCorneaR, ecc, CORNEA_AT0) - edgeLift);
        PCR_value = findRootBisection(G, 2, 20);
      } catch (e) {
        alert("无法求解 PCR: " + e.message);
        return;
      }
    
      // 保存计算结果到各输入框的 data-backend 属性中
      document.getElementById("corneaR").dataset.backend = computedCorneaR;
      document.getElementById("BCR").dataset.backend = computedBCR;
      document.getElementById("AC1R").dataset.backend = computedAC1R;
      if (document.getElementById("lockAC2R").checked) {
        if (ac2rDelta === null) {
          ac2rDelta = computedAC2R - computedAC1R;
        }
        document.getElementById("AC2R").dataset.backend = computedAC1R + ac2rDelta;
      } else {
        document.getElementById("AC2R").dataset.backend = computedAC2R;
        ac2rDelta = null;
      }
      document.getElementById("PCR").dataset.backend = PCR_value;
    
      globalRCR_numerical = RCR_numerical;
      globalRCR_simple = RCR_simple;
      updateRCRField();
    
      // 更新显示模式后同步更新各输入框显示值
      updateDisplayMode();
    
      // 修改“结果显示”部分：显示各弧段宽度而非止点位置
      document.getElementById("results").innerHTML = `
        <h2>各弧段宽度</h2>
        <ul>
          <li>BC宽度 = ${BC_width.toFixed(4)} mm</li>
          <li>RC宽度 = ${RC_width.toFixed(4)} mm</li>
          <li>AC1宽度 = ${AC1_width.toFixed(4)} mm</li>
          <li>AC2宽度 = ${AC2_width.toFixed(4)} mm</li>
          <li>PC宽度 = ${PC_width.toFixed(4)} mm</li>
        </ul>
        <p>当前等高点: ${equalChoice}，请确认（修改）参数后观察图形更新。</p>
      `;
    
      // 调用绘图函数显示更新后的曲线图
      drawPlots();
    };
    
    /***************************************************************************************
     * 绘图函数（包含角膜/晶状体矢高图、泪膜厚度曲线及泪液荧光素图）
     ***************************************************************************************/
    const drawPlots = () => {
      const corneaR_value = parseFloat(document.getElementById("corneaR").dataset.backend);
      const BCR_value = parseFloat(document.getElementById("BCR").dataset.backend);
      const AC1R_value = parseFloat(document.getElementById("AC1R").dataset.backend);
      const AC2R_value = parseFloat(document.getElementById("AC2R").dataset.backend);
      const RCR_value = parseFloat(document.getElementById("RCR").dataset.backend);
      const PCR_value = parseFloat(document.getElementById("PCR").dataset.backend);
      const BOD = parseFloat(document.getElementById("BOD").value);
      const lensD = parseFloat(document.getElementById("lensD").value);
      const edgeLift = parseFloat(document.getElementById("edgeLift").value);
      const ecc = parseFloat(document.getElementById("ecc").value);
    
      const BCend  = BOD / 2;
      const RCend  = BOD / 2 + 0.7;
      const AC1end = ((lensD / 2 - 0.5) - (BOD / 2 + 0.7)) / 2 + (BOD / 2 + 0.7);
      const AC2end = lensD / 2 - 0.5;
      const PCend  = lensD / 2;
    
      const params = {
        BCR: BCR_value,
        AC1R: AC1R_value,
        AC2R: AC2R_value,
        BCend, RCend, AC1end, AC2end, PCend,
        SagBCAt0: SAG_BC_AT0
      };
    
      const sampleCount = 200;
      const xValues = Array.from({ length: sampleCount + 1 }, (_, i) => i * PCend / sampleCount);
      const corneaVals = xValues.map(x => corneaSag(x, corneaR_value, ecc, CORNEA_AT0));
      const lensVals = xValues.map(x => lensSag(x, params, RCR_value, PCR_value));
      const allYs = [...corneaVals, ...lensVals];
      const yMin = Math.min(...allYs);
      const yMax = Math.max(...allYs);
      const padding = 40;
    
      // 绘制角膜与晶状体矢高图
      const canvasCombined = document.getElementById("combinedPlot");
      const ctxCombined = canvasCombined.getContext("2d");
      const plotWidth = canvasCombined.width - 2 * padding;
      const plotHeight = canvasCombined.height - 2 * padding;
      const transformX = x => padding + (x / PCend) * plotWidth;
      const transformY = y => padding + ((y - yMin) / (yMax - yMin)) * plotHeight;
      ctxCombined.clearRect(0, 0, canvasCombined.width, canvasCombined.height);
      ctxCombined.save();
      ctxCombined.strokeStyle = "#000";
      ctxCombined.beginPath();
      ctxCombined.moveTo(padding, transformY(0));
      ctxCombined.lineTo(canvasCombined.width - padding, transformY(0));
      ctxCombined.moveTo(padding, padding);
      ctxCombined.lineTo(padding, canvasCombined.height - padding);
      ctxCombined.stroke();
      ctxCombined.textAlign = "center";
      ctxCombined.fillText("X (mm)", (canvasCombined.width + padding) / 2, canvasCombined.height - 6);
      ctxCombined.save();
      ctxCombined.translate(10, canvasCombined.height / 2);
      ctxCombined.rotate(-Math.PI / 2);
      ctxCombined.textAlign = "center";
      ctxCombined.fillText("Y (mm)", 0, 0);
      ctxCombined.restore();
      drawAxisTicks(ctxCombined, transformX, transformY, 0, PCend, yMin, yMax, 5, 5, 1);
      // 绘制角膜曲线（半透明黑色虚线）
      ctxCombined.setLineDash([5,5]);
      ctxCombined.strokeStyle = "rgba(0,0,0,0.5)";
      ctxCombined.beginPath();
      xValues.forEach((x, i) => {
        const cx = transformX(x);
        const cy = transformY(corneaVals[i]);
        if (i === 0) ctxCombined.moveTo(cx, cy);
        else ctxCombined.lineTo(cx, cy);
      });
      ctxCombined.stroke();
      ctxCombined.setLineDash([]);
      // 绘制晶状体矢高，各段采用不同颜色
      const segments = [
        { start: 0, end: BCend, color: "red" },
        { start: BCend, end: RCend, color: "green" },
        { start: RCend, end: AC1end, color: "blue" },
        { start: AC1end, end: AC2end, color: "red" },
        { start: AC2end, end: PCend, color: "green" }
      ];
      segments.forEach(segment => {
        ctxCombined.strokeStyle = segment.color;
        ctxCombined.beginPath();
        const segPoints = xValues.filter(xx => xx >= segment.start && xx <= segment.end);
        segPoints.forEach((xx, i) => {
          const cx = transformX(xx);
          const cy = transformY(lensSag(xx, params, RCR_value, PCR_value));
          if (i === 0) ctxCombined.moveTo(cx, cy);
          else ctxCombined.lineTo(cx, cy);
        });
        ctxCombined.stroke();
      });
      ctxCombined.fillStyle = "#000";
      ctxCombined.font = "14px Arial";
      ctxCombined.fillText("角膜与镜片矢高曲线", canvasCombined.width / 2, padding - 10);
      ctxCombined.restore();
    
      // 绘制泪膜厚度曲线
      const tearVals = xValues.map(x => tearSag(x, params, RCR_value, PCR_value, corneaR_value, ecc, CORNEA_AT0));
      const criticalX = [0, BCend, RCend, AC1end, AC2end];
      const criticalTearVals = criticalX.map(x => tearSag(x, params, RCR_value, PCR_value, corneaR_value, ecc, CORNEA_AT0));
      const minTear = Math.min(...criticalTearVals);
      const newTearVals_mm = tearVals.map(v => v - minTear);
      const newTearVals = newTearVals_mm.map(v => v * 1000);
      const yMinTear = Math.min(...newTearVals);
      const yMaxTear = Math.max(...newTearVals);
      const canvasTear = document.getElementById("tearPlot");
      const ctxTear = canvasTear.getContext("2d");
      const plotWidthTear = canvasTear.width - 2 * padding;
      const plotHeightTear = canvasTear.height - 2 * padding;
      const transformXTear = x => padding + (x / PCend) * plotWidthTear;
      const transformYTear = y => padding + plotHeightTear - ((y - yMinTear) / (yMaxTear - yMinTear)) * plotHeightTear;
      
      ctxTear.clearRect(0, 0, canvasTear.width, canvasTear.height);
      ctxTear.save();
      ctxTear.strokeStyle = "#000";
      ctxTear.beginPath();
      ctxTear.moveTo(padding, transformYTear(0));
      ctxTear.lineTo(canvasTear.width - padding, transformYTear(0));
      ctxTear.moveTo(padding, padding);
      ctxTear.lineTo(padding, canvasTear.height - padding);
      ctxTear.stroke();
      ctxTear.textAlign = "center";
      ctxTear.fillText("X (mm)", (canvasTear.width + padding) / 2, canvasTear.height - 6);
      ctxTear.save();
      ctxTear.translate(10, canvasTear.height / 2);
      ctxTear.rotate(-Math.PI / 2);
      ctxTear.textAlign = "center";
      ctxTear.fillText("Tear (µm)", 0, 0);
      ctxTear.restore();
      drawAxisTicks(ctxTear, transformXTear, transformYTear, 0, PCend, yMinTear, yMaxTear, 5, 5, 1);
      ctxTear.strokeStyle = "purple";
      ctxTear.beginPath();
      xValues.forEach((x, i) => {
        const cx = transformXTear(x);
        const cy = transformYTear(newTearVals[i]);
        if (i === 0) ctxTear.moveTo(cx, cy);
        else ctxTear.lineTo(cx, cy);
      });
      ctxTear.stroke();
      const markPoints = [0, BCend, RCend, AC1end, AC2end];
      ctxTear.fillStyle = "red";
      markPoints.forEach(xVal => {
        const tearVal = (tearSag(xVal, params, RCR_value, PCR_value, corneaR_value, ecc, CORNEA_AT0) - minTear) * 1000;
        const cx = transformXTear(xVal);
        const cy = transformYTear(tearVal);
        ctxTear.beginPath();
        ctxTear.arc(cx, cy, 3, 0, 2 * Math.PI);
        ctxTear.fill();
        ctxTear.fillStyle = "#000";
        ctxTear.font = "12px Arial";
        ctxTear.fillText(tearVal.toFixed(2), cx + 20, cy - 8);
        ctxTear.fillStyle = "red";
      });
      ctxTear.fillStyle = "#000";
      ctxTear.font = "14px Arial";
      ctxTear.fillText("泪膜厚度曲线 (归零)", canvasTear.width / 2, padding - 10);
      ctxTear.restore();
    
      // 绘制泪液荧光素图
      const getTearThicknessInterp = x => {
        const ratio = x / PCend;
        const idx = ratio * sampleCount;
        const i = Math.floor(idx);
        const fraction = idx - i;
        if (i >= newTearVals.length - 1) return newTearVals[newTearVals.length - 1];
        return newTearVals[i] * (1 - fraction) + newTearVals[i + 1] * fraction;
      };
      drawFluoresceinPlot(PCend, getTearThicknessInterp);
    };
    
    /***************************************************************************************
     * 绘制泪液荧光素图函数
     ***************************************************************************************/
    const drawFluoresceinPlot = (PCend, getTearThickness) => {
      const canvas = document.getElementById("fluoresceinPlot");
      const ctx = canvas.getContext("2d");
      const padding = 40;
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      const centerX = width / 2;
      const centerY = height / 2;
      const plotDiameter = Math.min(width, height) - 2 * padding;
      const plotRadius = plotDiameter / 2;
      const scale = plotRadius / PCend;
      const imageData = ctx.createImageData(width, height);
      const data = imageData.data;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const dx = x - centerX;
          const dy = y - centerY;
          const rPixels = Math.sqrt(dx * dx + dy * dy);
          const r_mm = rPixels / scale;
          let color;
          if (r_mm <= PCend) {
            let T = getTearThickness(r_mm);
            T = Math.min(Math.max(T, 0), 100);
            const greenIntensity = Math.round((T / 100) * 255);
            color = [0, greenIntensity, 0, 255];
          } else {
            color = [255, 255, 255, 255];
          }
          const idx = (y * width + x) * 4;
          data[idx] = color[0];
          data[idx + 1] = color[1];
          data[idx + 2] = color[2];
          data[idx + 3] = color[3];
        }
      }
      ctx.putImageData(imageData, 0, 0);
      ctx.fillStyle = "#000";
      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.fillText("泪液荧光素图", width / 2, padding - 10);
    };
    
    /***************************************************************************************
     * AC2R 锁定功能及自动绘图绑定
     ***************************************************************************************/
    const updateAC2RLock = () => {
      const lock = document.getElementById("lockAC2R").checked;
      const ac1rInput = document.getElementById("AC1R");
      const ac2rInput = document.getElementById("AC2R");
      if (lock) {
        if (ac2rDelta === null) {
          ac2rDelta = parseFloat(ac2rInput.dataset.backend) - parseFloat(ac1rInput.dataset.backend);
        }
        ac2rInput.dataset.backend = parseFloat(ac1rInput.dataset.backend) + ac2rDelta;
        ac2rInput.disabled = true;
      } else {
        ac2rInput.disabled = false;
        ac2rDelta = null;
      }
      updateDisplayMode();
      drawPlots();
    };

    // 绑定 AC1R 和锁定复选框事件
    document.getElementById("AC1R").addEventListener("input", updateAC2RLock);
    document.getElementById("lockAC2R").addEventListener("change", updateAC2RLock);
    
    // 为其它所有输入绑定自动绘图事件（除计算按钮外）
    document.querySelectorAll("input").forEach(input => {
      if (input.id !== "calculateBtn") {
        input.addEventListener("input", () => {
          drawPlots();
        });
      }
    });
    
    // 绑定计算按钮点击事件
    document.getElementById("calculateBtn").addEventListener("click", calculateParameters);
    
    // 页面加载时先计算一次参数
    calculateParameters();
  </script>
</body>
</html>
